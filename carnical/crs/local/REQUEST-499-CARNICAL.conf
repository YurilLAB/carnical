# SPDX-License-Identifier: Apache-2.0
# Local supplement, NOT part of the signed upstream CRS release. Run before CRS's
# anomaly evaluation, after its score initialization (also for multiphase builds).
# Decode only for matching: never rewrite the request.
# ARGS already has one transport decoding layer. Two more passes cover nested
# escapes, with multiMatch checking the original and each transformed value.
# XML scalars use the same signatures. Ordinary prose/URLs alone are not attacks.

SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)[\x22'][\s)]*(?:or|and)[\s(]*[a-z_][a-z0-9_.:-]*\s*\(" "id:5006001,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath predicate injection syntax',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx [\x22']\s*\]\s*\|\s*/|\|\s*//[^\s|]+\s*\|\s*//" "id:5006002,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath union injection syntax',setvar:tx.inbound_anomaly_score_pl1=+5"

# Shell punctuation plus a command, rather than blocking punctuation by itself. After a
# line break the command must also look like one (alone, or with an option, a path, a glob, a
# URL, an address, a file name that starts with a letter, a host and port or a shell operator):
# text and GraphQL put words such as "id" on their own lines, and "Cat 2.0" is a version.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:[;|`]|&&|\$\()\s*(?:/[^\s;|`]*\/)?(?:i[\x22']*d|w[\x22']*h[\x22']*o[\x22']*a[\x22']*m[\x22']*i|uname|cat|curl|wget|bash|sh|powershell|pwsh|cmd(?:\.exe)?|nslookup|ping|sleep|printf|echo|ls|env|python[0-9.]*|perl|ruby|nc|netcat)(?:[\s;|`)&]|$)|[\n\r]\s*(?:/[^\s;|`]*\/)?(?:i[\x22']*d|w[\x22']*h[\x22']*o[\x22']*a[\x22']*m[\x22']*i|uname|cat|curl|wget|bash|sh|powershell|pwsh|cmd(?:\.exe)?|nslookup|ping|sleep|printf|echo|ls|env|python[0-9.]*|perl|ruby|nc|netcat)(?:\s*(?:[;|`&<>]|\z)|\s+(?:[-/$*~]|\.\.?/|https?://|[0-9]+(?:\.[0-9]+){3}|[0-9]+\s*\z|[a-z_][a-z0-9_-]*\.[a-z][a-z0-9]{0,4}(?:\s|\z)|[a-z0-9-]+(?:\.[a-z0-9-]+)+\s+[0-9]{1,5}\s*\z))" "id:5006003,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Shell command chaining or substitution',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[\s;|&])(?:cmd(?:\.exe)?\s+/[ck]\s|(?:powershell|pwsh)(?:\.exe)?\s+-(?:enc(?:odedcommand)?|command|c)\s)" "id:5006004,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Command interpreter invocation',setvar:tx.inbound_anomaly_score_pl1=+5"

SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:\{\{|[$#*]\{|<%=)[\s(]*(?:[0-9]+\s*[*+/\-]\s*[0-9]+|config\s*(?:\}\}|[.(])|[^\r\n]*(?:__class__|__globals__|__mro__|__subclasses__|getclass\s*\(|freemarker\.template\.utility\.Execute|java\.lang\.Runtime))" "id:5006005,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Server template expression injection',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[/\\]|%(?:25)*(?:2f|5c))(?:\.|%(?:25)*2e){2}(?:[/\\]|%(?:25)*(?:2f|5c))" "id:5006006,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,multiMatch,severity:CRITICAL,msg:'Nested-encoded parent path traversal',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?:^|[^A-Za-z0-9+/])rO0AB[A-Za-z0-9+/]{4}|(?i)(?:^|[^a-f0-9])aced0005(?:7[0-9a-f]|[0-9a-f]{4})" "id:5006007,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,multiMatch,severity:CRITICAL,msg:'Java serialization stream in a request field',setvar:tx.inbound_anomaly_score_pl1=+5"

# Non-HTTP fetch protocols and ambiguous numeric/userinfo authorities need no
# DNS lookup. Approved normal HTTPS destinations belong in a site API contract.
# A double quote in the userinfo still counts ("http://a.example\"@127.0.0.1/" is 127.0.0.1 to
# Python and browsers), unless JSON goes on after it: "https://schema.org","@type" is JSON.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[\s\x22'])(?:dict|gopher|file|jar|netdoc|ldap|rmi)://|https?://(?:(?:[^/\s\x22]|\x22[^/\s,:}\]\x22@])*\x22?@|0x[0-9a-f]+(?:[/:]|$)|[0-9]{8,}(?:[/:]|$)|0[0-7]+\.)" "id:5006008,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Unsafe fetch protocol or ambiguous URL authority',setvar:tx.inbound_anomaly_score_pl1=+5"

# XPath 2+ comments are whitespace, can nest, and can separate an operator from
# its function. Detect the structural prefix without recursively parsing them.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)[\x22']\s*(?:(?:or|and)[\s(]*)?\(:" "id:5006009,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath comment obfuscation after a quote',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?:[;|&`\n\r]|\$\()\s*(?:\$\{IFS\}|[a-zA-Z]+\$\{[a-zA-Z_][a-zA-Z_0-9]*\}[a-zA-Z]+|[a-zA-Z]+(?:[\x22']{2}[a-zA-Z]+)+)" "id:5006010,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Obfuscated shell command spelling',setvar:tx.inbound_anomaly_score_pl1=+5"

# Paths only an attacker asks for: an exploit's entry point, or what an exploit leaves behind. PHPUnit's eval-stdin.php
# (CVE-2017-9841); PHP run from the folders WordPress and its plugins only write data to (uploads, cache, upgrade, backups,
# logs), in any directory, including a second extension or path info after it (caching plugins keep PHP files in cache/
# for PHP to include, not for visitors to fetch); the File Manager connectors (CVE-2020-25213) and anything PHP in its
# files folder; Slider Revolution's update folder; Laravel Ignition's execute-solution (CVE-2021-3129); well-known web
# shells by name. A site that has none of these answers 404 anyway.
SecRule REQUEST_FILENAME "@rx /src/util/php/eval-stdin\.php|/wp-content/(?:uploads|cache|upgrade|backups?[^/]*|ai1wm-backups|updraft|wc-logs|wflogs|et-cache|litespeed)/.*\.ph(?:p[0-9]?|tml?|ar|ps|t)(?:[/;.:\s]|$)|/wp-content/plugins/wp-file-manager/lib/(?:php/connector\.(?:minimal|standalone)\.php|files/.*\.ph(?:p[0-9]?|tml?|ar|ps|t)(?:[/;.:\s]|$))|/revslider/temp/update_extract/|/_ignition/execute-solution(?:[/;.\s]|$)|/(?:c99|r57|wso|b374k|shell|webshell|backdoor)\.php(?:[/;.:\s]|$)" "id:5006011,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Exploit or web shell path',setvar:tx.inbound_anomaly_score_pl1=+5"

# Debug and diagnostic interfaces that hold secrets or run code, and have no business facing the internet: Spring Boot's
# actuator endpoints other than health, info and metrics (also behind a path parameter, which Tomcat drops), Jolokia,
# Go's pprof and expvar, Apache's server-status and server-info (which take a proxy on the same machine for a local
# visitor), the Symfony profiler and Yii's debug module. -local-rules-off 5006012 lets a site serve one on purpose.
SecRule REQUEST_FILENAME "@rx /actuator(?:;[^/]*)?/(?:env|configprops|heapdump|threaddump|jolokia|gateway|logfile|shutdown|restart|refresh|httptrace|httpexchanges|trace|loggers)(?:[/;.\s]|$)|/jolokia(?:[/;.\s]|$)|/debug/(?:pprof|vars)(?:[/;.\s]|$)|/server-(?:status|info)(?:[/;.\s]|$)|/_profiler(?:[/;.\s]|$)|/debug/default/(?:view|index|toolbar|db-explain)(?:[/;.\s]|$)" "id:5006012,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Debug or diagnostic interface',setvar:tx.inbound_anomaly_score_pl1=+5"

# Installers: on a site that is set up they have nothing to do, and on one that is not, whoever reaches them first owns
# it. WordPress's install.php and setup-config.php, Joomla's installation folder and Drupal's install.php.
# -local-rules-off 5006013 while installing through the edge.
SecRule REQUEST_FILENAME "@rx /wp-admin/(?:install|setup-config)\.php(?:[/;.:\s]|$)|/installation/index\.php(?:[/;.:\s]|$)|/core/install\.php(?:[/;.:\s]|$)" "id:5006013,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Web application installer',setvar:tx.inbound_anomaly_score_pl1=+5"

# Scanners the CRS list leaves out, by the user agent they send by default.
SecRule REQUEST_HEADERS:User-Agent "@pm dirsearch jaeles" "id:5006014,phase:1,pass,log,t:none,t:lowercase,severity:CRITICAL,msg:'Scanner user agent',setvar:tx.inbound_anomaly_score_pl1=+5"

# Database administration tools: Adminer by its file name, phpMyAdmin and phpPgAdmin by their folder. They take a database
# password from anyone who asks, so they belong behind a private address. A page that is only named after one (a wiki
# entry, a tutorial) passes. -local-rules-off 5006018 for a site that serves one through the edge on purpose.
SecRule REQUEST_FILENAME "@rx /adminer(?:-[0-9][0-9a-z.\-]*)?\.php(?:[/;.:\s]|$)|/(?:php-?my-?admin|phppgadmin)(?:-?[0-9][0-9a-z.\-]*)?/" "id:5006018,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Database administration tool',setvar:tx.inbound_anomaly_score_pl1=+5"

# Pages left behind that print the server's settings, paths and environment: info.php, phpinfo.php, test.php.
# -local-rules-off 5006019 for a site whose own page has one of these names.
SecRule REQUEST_FILENAME "@rx /(?:php[_\-]?info|info|pinfo|test|php[_\-]?test)\.php(?:[/;.:\s]|$)" "id:5006019,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'PHP information or test page',setvar:tx.inbound_anomaly_score_pl1=+5"

# Consoles that run what they are sent: the Werkzeug debugger (by the parameter every one of its commands carries),
# WebLogic's console, JBoss's JMX console and invokers, the H2 console, the Rails web console and Tomcat's manager.
SecRule REQUEST_FILENAME|ARGS_GET_NAMES "@rx ^__debugger__$|/console(?:;[^/]*)?/login(?:;[^/]*)?/loginform\.jsp(?:[/;.\s]|$)|console\.portal(?:[/;.\s]|$)|/(?:jmx-console|h2-console|__web_console)(?:[/;.\s]|$)|/invoker(?:;[^/]*)?/(?:jmx|ejb)invokerservlet(?:[/;.\s]|$)|/(?:host-)?manager(?:;[^/]*)?/html(?:[/;.\s]|$)" "id:5006020,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Debugger or server console',setvar:tx.inbound_anomaly_score_pl1=+5"

# A forwarded host is a host name with an optional port, a list of them, or nothing. Anything else (a space left by a
# folded line, a path, a user name) is an attempt to slip a second value past whatever reads it. The proxy removes these
# headers before the application sees them; this refuses the request that carried one.
SecRule REQUEST_HEADERS:X-Forwarded-Host|REQUEST_HEADERS:X-Forwarded-Server|REQUEST_HEADERS:X-Host|REQUEST_HEADERS:X-Original-Host "!@rx ^[\t ]*(?:(?:[a-z0-9_](?:[a-z0-9_\-]*[a-z0-9_])?(?:\.[a-z0-9_](?:[a-z0-9_\-]*[a-z0-9_])?)*\.?|\[[0-9a-f:.]+\])(?::[0-9]{1,5})?(?:[\t ]*,[\t ]*(?:[a-z0-9_](?:[a-z0-9_\-]*[a-z0-9_])?(?:\.[a-z0-9_](?:[a-z0-9_\-]*[a-z0-9_])?)*\.?|\[[0-9a-f:.]+\])(?::[0-9]{1,5})?)*)?[\t ]*$" "id:5006022,phase:1,pass,log,t:none,t:lowercase,severity:CRITICAL,msg:'Forwarded host header that is not a host name',setvar:tx.inbound_anomaly_score_pl1=+5"

# Remote file inclusion, where a URL to another host has no ordinary reason to be. Each URL's host is kept under a key of
# its own and compared with this site's name, so a repeated parameter cannot hide one URL behind another, and a link to
# this site or one of its subdomains passes. This site's name is tx.carnical_site: the request's Host without a port or
# a leading www., and only when it is one of the names the operator gave (Settings.SiteHosts). The Host header alone
# proves nothing, because the client writes it; with no names given, no address is this site's.
# A URL of any scheme, or a // or \\ path, in a parameter named like a file to include, a page to load or a template.
SecRule ARGS:/(?i)(?:^\x20*|\.)(?:page|file|filename|filepath|path|include|inc|require|module|mod|template|tpl|dir|folder|doc|document|root|lang|language|layout|theme|skin|style|conf|config|load|pg)(?:\[[^\]]*\]|\.[0-9]+)*$/ "@rx ^\s*(?:[a-z][a-z0-9+.\-]*:)?(?://|\\\\)(?:[^/?#\\\s]*@)?([a-z0-9_\-.]*?|\[[0-9a-f:.]+\])\.?(?::[0-9]*)?(?:[/\\?#]|$)" "id:5006015,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'Remote file reference in an include parameter',setvar:tx.carnical_rfi_include_n=+1,setvar:'tx.carnical_rfi_include_%{tx.carnical_rfi_include_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_include_[0-9]+$/ "!@endsWith .%{tx.carnical_site}" "t:none,setvar:tx.inbound_anomaly_score_pl1=+5"
# FTP, SMB or SSH addresses, and // or \\ paths that name a host, in any parameter: what PHP's include and other fetchers
# accept, and an ordinary link does not use.
SecRule ARGS|XML:/*|XML://@* "@rx ^\s*(?:(?:ftps?|smb|ssh2(?:\.[a-z]+)?):)?(?://|\\\\)(?:[^/?#\\\s]*@)?([a-z0-9_][a-z0-9_\-]*(?:\.[a-z0-9_\-]+)+|\[[0-9a-f:.]+\])\.?(?::[0-9]*)?(?:[/\\?#]|$)" "id:5006016,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'FTP, SMB or scheme-less reference to another host',setvar:tx.carnical_rfi_bare_n=+1,setvar:'tx.carnical_rfi_bare_%{tx.carnical_rfi_bare_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_bare_[0-9]+$/ "!@endsWith .%{tx.carnical_site}" "t:none,setvar:tx.inbound_anomaly_score_pl1=+5"
# A web URL to a text or include file on another host: how remote file inclusion serves PHP without running it first.
SecRule ARGS|XML:/*|XML://@* "@rx ^\s*https?://(?:[^/?#\\\s]*@)?([a-z0-9_][a-z0-9_\-]*(?:\.[a-z0-9_\-]+)+|\[[0-9a-f:.]+\])\.?(?::[0-9]*)?/[^?#\s]*\.(?:txt|inc)(?:[?#]|$)" "id:5006017,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'Remote text or include file URL',setvar:tx.carnical_rfi_text_n=+1,setvar:'tx.carnical_rfi_text_%{tx.carnical_rfi_text_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_text_[0-9]+$/ "!@endsWith .%{tx.carnical_site}" "t:none,setvar:tx.inbound_anomaly_score_pl1=+5"
# The web address of a PHP script on another host, as the whole value of a parameter in the URL: what an include of a
# remote file is given when the remote side serves the script's text. Parameters named like a link (url, website, ref,
# redirect_uri, returnUrl and the like) are left alone: a visitor's own site, a return address or a referrer may well be
# a .php page. -local-rules-off 5006021 for a site that takes such addresses under other names.
SecRule ARGS_GET|!ARGS_GET:/(?i)(?:^|[^a-z])(?:[a-z]*(?:url|uri|link|href)|(?:url|uri|link|href)[a-z]*|ref|referer|referrer|site|website|homepage|redirect|redir|return|returnto|next|continue|goto|dest|destination|target|callback|back|source|feed|rss|location|forward|domain|host|u|r|q|s|to|from|out|go)(?:[^a-z]|$)/ "@rx \A\s*https?://(?:[^/?#\\\s]*@)?([a-z0-9_][a-z0-9_\-]*(?:\.[a-z0-9_\-]+)*|\[[0-9a-f:.]+\])\.?(?::[0-9]*)?/[^?#\s]*\.(?:php[0-9]?|phtml|pht|phps|phar)(?:[?#/;]|\z)" "id:5006021,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'Script on another host in a URL parameter',setvar:tx.carnical_rfi_script_n=+1,setvar:'tx.carnical_rfi_script_%{tx.carnical_rfi_script_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_script_[0-9]+$/ "!@endsWith .%{tx.carnical_site}" "t:none,setvar:tx.inbound_anomaly_score_pl1=+5"

# CRS catches an ASCII CR/LF in an argument (response splitting). Some stacks narrow a Unicode "newline homoglyph" to
# CR/LF when they build a response header (NEL, the line/paragraph separators, and codepoints whose low byte is 0x0A/0x0D
# such as U+560A/U+560D). Refuse one only when it sits right before a real response header name and colon, so ordinary
# text that merely contains such a codepoint is left alone.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:\xc2\x85|\xe2\x80[\xa8\xa9]|\xe5\x98[\x8a\x8d])[\x09\x20]*(?:set-cookie|location|refresh|link|transfer-encoding|content-(?:length|type|disposition|security-policy|range))[\x09\x20]*:" "id:5006023,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Unicode newline header injection (response splitting)',setvar:tx.inbound_anomaly_score_pl1=+5"

# Stricter rules: on some sites ordinary requests look exactly like what they refuse, so each only reports what it finds,
# scoring nothing, until -local-rules-on names it (crs.go sets tx.carnical_points_<id> to 5 for one named, 0 otherwise).
# Switch one on where that is not so.
# The path /console and nothing under it: where the Werkzeug debugger and WebLogic's console start, and on a shop a page
# of games consoles.
SecRule REQUEST_FILENAME "@rx \A/console/?\z" "id:5006101,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Console path',setvar:'tx.inbound_anomaly_score_pl1=+%{tx.carnical_points_5006101}'"
# Rule 5006021 for the fields of a form or a JSON body, where a visitor may be asked for a web address under a field
# name that does not say so (input_3), and that address may be a .php page.
SecRule ARGS_POST|!ARGS_POST:/(?i)(?:^|[^a-z])(?:[a-z]*(?:url|uri|link|href)|(?:url|uri|link|href)[a-z]*|ref|referer|referrer|site|website|homepage|redirect|redir|return|returnto|next|continue|goto|dest|destination|target|callback|back|source|feed|rss|location|forward|domain|host|u|r|q|s|to|from|out|go)(?:[^a-z]|$)/ "@rx \A\s*https?://(?:[^/?#\\\s]*@)?([a-z0-9_][a-z0-9_\-]*(?:\.[a-z0-9_\-]+)*|\[[0-9a-f:.]+\])\.?(?::[0-9]*)?/[^?#\s]*\.(?:php[0-9]?|phtml|pht|phps|phar)(?:[?#/;]|\z)" "id:5006102,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'Script on another host in a body parameter',setvar:tx.carnical_rfi_body_n=+1,setvar:'tx.carnical_rfi_body_%{tx.carnical_rfi_body_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_body_[0-9]+$/ "!@endsWith .%{tx.carnical_site}" "t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.carnical_points_5006102}'"
# A forwarded host that is not the host the request was made to (without regard to case, a port or a trailing dot): how
# password-reset links and caches are poisoned through an application that believes it. The proxy puts its own value in
# its place either way. A load balancer in front may send the public name here while it asks for the origin's. A header
# with nothing in it names no host.
SecRule REQUEST_HEADERS:X-Forwarded-Host|REQUEST_HEADERS:X-Host|REQUEST_HEADERS:X-Original-Host "@rx \A[\t ]*([^\t ].*?)\.?(?::[0-9]{1,5})?[\t ]*\z" "id:5006103,phase:1,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'Forwarded host that is not the host asked for',setvar:tx.carnical_fwd_n=+1,setvar:'tx.carnical_fwd_%{tx.carnical_fwd_n}=%{tx.1}',chain"
    SecRule TX:/^carnical_fwd_[0-9]+$/ "!@streq %{tx.carnical_host}" "t:none,setvar:'tx.inbound_anomaly_score_pl1=+%{tx.carnical_points_5006103}'"
