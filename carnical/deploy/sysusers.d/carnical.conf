# One user per part, so that the kernel keeps them apart. Install as /etc/sysusers.d/carnical.conf and run
# `systemd-sysusers`. None can log in, none has a home directory that exists, none is in any other's group.
#
# Type  Name              ID  GECOS                           Home                        Shell
u       carnical-edge     -   "Carnical edge"                 /var/lib/carnical/edge      /usr/sbin/nologin
u       carnical-portal   -   "Carnical customer portal"      /var/lib/carnical/portal    /usr/sbin/nologin
u       carnical-ctl      -   "Carnical control plane"        /var/lib/carnical/ctl       /usr/sbin/nologin
u       carnical-signer   -   "Carnical configuration signer" /var/lib/carnical/signer    /usr/sbin/nologin
u       carnical-audit    -   "Carnical audit"                /var/lib/carnical/audit     /usr/sbin/nologin
