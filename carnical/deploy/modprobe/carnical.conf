# Kernel modules that a web server has no use for and that have been the way in again and again. A module that cannot
# be loaded cannot be reached by an attacker who has only a service user. Install as /etc/modprobe.d/carnical.conf.
#
# nf_tables stays: the firewall in nftables/carnical.nft needs it. What is removed is an unprivileged user's way to it (user
# namespaces, in sysctl/90-carnical.conf).

# Network protocols nobody here uses.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install vsock /bin/false
install vmw_vsock_vmci_transport /bin/false

# The kernel crypto API as a socket (AF_ALG): behind several recent local privilege escalations and not used by a
# proxy or a database. Everything that needs encryption here does it in user space.
install algif_aead /bin/false
install algif_skcipher /bin/false
install algif_hash /bin/false
install algif_rng /bin/false

# File systems and a test driver that are only ever loaded by an attacker who can make a device.
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install vivid /bin/false
