# Include in NGINX's http context. Replace names, paths and the approved serial.
# Use a dedicated client CA per site; its private key stays offline.
map "$ssl_server_name|$ssl_client_verify|$ssl_client_serial" $carnical_origin_authenticated {
    default 0;
    "origin.example.com|SUCCESS|REPLACE_WITH_APPROVED_CERTIFICATE_SERIAL" 1;
}
map $host $carnical_origin_host_allowed {
    default 0;
    origin.example.com 1;
}
log_format carnical_origin escape=json
    '{"event":"origin_access","status":$status,"mtls":"$ssl_client_verify","serial":"$ssl_client_serial","sni":"$ssl_server_name"}';

server {
    listen 443 ssl;
    server_name origin.example.com;

    ssl_certificate /etc/nginx/carnical/origin.crt;
    ssl_certificate_key /etc/nginx/carnical/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_client_certificate /etc/nginx/carnical/site-client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_session_cache off;
    ssl_session_tickets off;
    ssl_early_data off;
    keepalive_timeout 15s;
    keepalive_time 1m;
    keepalive_requests 1000;
    access_log /var/log/nginx/carnical-origin-access.log carnical_origin;

    # These variables come from TLS, never from HTTP headers.
    # Bind authorization to SNI as well as the approved client identity.
    if ($carnical_origin_authenticated = 0) { return 403; }
    if ($carnical_origin_host_allowed = 0) { return 421; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        # Route to the application's configured site after authenticating ingress.
        proxy_set_header Host example.com;
        proxy_set_header Connection "";
        # Do not pass visitor-supplied TLS identity claims to the application.
        proxy_set_header X-SSL-Client-Verify "";
        proxy_set_header X-SSL-Client-Serial "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header SSL-Client-Verify "";
        proxy_set_header SSL-Client-Serial "";
    }
}
