# Directories, owned by the part that uses them and by no one else. Install as /etc/tmpfiles.d/carnical.conf and run
# `systemd-tmpfiles --create`.
#
# Type Path                              Mode  User             Group            Age
d      /etc/carnical                     0755  root             root             -
d      /etc/carnical/signer              0700  carnical-signer  carnical-signer  -
d      /var/lib/carnical                 0711  root             root             -
d      /var/lib/carnical/edge            0700  carnical-edge    carnical-edge    -
d      /var/lib/carnical/edge/uploads    0700  carnical-edge    carnical-edge    -
d      /var/lib/carnical/portal          0700  carnical-portal  carnical-portal  -
d      /var/lib/carnical/ctl             0700  carnical-ctl     carnical-ctl     -
d      /var/lib/carnical/signer          0700  carnical-signer  carnical-signer  -
d      /var/lib/carnical/audit           0700  carnical-audit   carnical-audit   -
# The crawler lists -bots-ranges reads: the updater's alone, so that no service can choose who passes as a search engine;
# readable by all.
d      /var/lib/carnical/ranges          0755  carnical-ranges  carnical-ranges  -
d      /var/log/carnical                 0750  carnical-audit   carnical-audit   -
# The root host audit's baselines, status and log: root's alone, because the audit believes its baselines.
d      /var/lib/carnical/host-audit      0700  root             root             -
d      /var/log/carnical-host            0700  root             root             -
# carnical-netwatch's state, which the edge reads (-netwatch-state): root's, readable by all, as it holds counts and ports.
d      /run/carnical                     0755  root             root             -
d      /run/carnical/netwatch            0755  root             root             -
