name: ADR

on:
  push:
    branches:
      - main
      - edge-crs
    paths:
      - "docs/adr/**"
      - "magefile_adr.go"
      - ".github/workflows/adr.yml"
  pull_request:
    paths:
      - "docs/adr/**"
      - "magefile_adr.go"
      - ".github/workflows/adr.yml"

permissions: {}

concurrency:
  group: adr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache: true
      - run: go run mage.go adr
