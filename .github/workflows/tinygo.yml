name: Tinygo tests

on:
  push:
    branches:
      - main
      - edge-crs
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - edge-crs
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions: {}

concurrency:
  group: tinygo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.26.10']
        # tinygo-version is meant to stay aligned with the one used in corazawaf/coraza-proxy-wasm;
        # 0.41.0 is the first that supports Go 1.26, which go.mod needs; 0.43.0 is the newest.
        tinygo-version: [0.43.0]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Setup tinygo
        uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: ${{ matrix.tinygo-version }}

      - name: Cache TinyGo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tinygo
          key: ${{ runner.os }}-tinygo-${{ matrix.tinygo-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tinygo-${{ matrix.tinygo-version }}-

      - name: Tests
        run: tinygo test -v -short ./internal/...

      - name: Tests no_memoize
        run: tinygo test -v -short -tags=coraza.no_memoize ./internal/...
