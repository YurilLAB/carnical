name: Fuzz tests

on:
  schedule:
    # https://crontab.guru/#05_14_*_*_*
    - cron: "05 14 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    name: Fuzz tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coraza's own operators and transformations, 3 minutes per target.
          - name: coraza
            packages: ""
            fuzz-time: 3m
          # Carnical's parsers and request paths: every Fuzz target the packages define, 1 minute each.
          - name: carnical formats
            packages: ./formats
            fuzz-time: 1m
          - name: carnical apiguard
            packages: ./apiguard
            fuzz-time: 1m
          - name: carnical control and config
            packages: ./control/... ./config ./notify
            fuzz-time: 1m
          - name: carnical policy, vpatch and proxy
            packages: ./policy ./vpatch/... ./netwatch ./proxy ./cmd/carnical
            fuzz-time: 1m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Run bounded fuzz workers and preserve diagnostics
        shell: bash
        run: |
          mkdir -p build/fuzz-reports
          # Go's ordinary test timeout does not bound fuzzing. Leave time in this job to retain evidence.
          set +e
          { time -p timeout --kill-after=30s 55m go run mage.go fuzz; } 2>&1 | tee build/fuzz-reports/run.log
          pipeline=("${PIPESTATUS[@]}")
          status=${pipeline[0]}
          set -e
          if [[ ${pipeline[1]} -ne 0 ]]; then
            echo '[CARNICAL_FUZZ_REPORT_FAILED] could not retain the run log' >&2
            exit "${pipeline[1]}"
          fi
          case "$status" in
            0) code=CARNICAL_FUZZ_PASSED ;;
            124) code=CARNICAL_FUZZ_TIMEOUT ;;
            137|143) code=CARNICAL_FUZZ_TERMINATED ;;
            *) code=CARNICAL_FUZZ_FAILED ;;
          esac
          if ! printf '%s exit=%s\n' "$code" "$status" | tee build/fuzz-reports/result.txt; then
            echo '[CARNICAL_FUZZ_REPORT_FAILED] could not retain the result' >&2
            exit 1
          fi
          exit "$status"
        env:
          GOMAXPROCS: '2'
          FUZZ_PACKAGES: ${{ matrix.packages }}
          FUZZ_TIME: ${{ matrix.fuzz-time }}
      # A failing target writes the input that broke it under testdata/fuzz; keep those so the crash can be replayed.
      - name: Collect failing inputs
        if: failure()
        run: |
          mkdir -p build/fuzz-failures
          git ls-files --others --exclude-standard -- '**/testdata/fuzz/**' | while read -r f; do
            mkdir -p "build/fuzz-failures/$(dirname "$f")"
            cp "$f" "build/fuzz-failures/$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: |
            build/fuzz-failures
            build/fuzz-reports
          if-no-files-found: error
          retention-days: 14
      - run: |
          gh issue create --title "$GITHUB_WORKFLOW ($MATRIX_NAME) #$GITHUB_RUN_NUMBER failed" \
                          --body "See [$GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
        if: failure() && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MATRIX_NAME: ${{ matrix.name }}
