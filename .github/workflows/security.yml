name: Security review

on:
  push:
    branches: [edge-crs, main]
  pull_request:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gosec:
    name: Go security (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: '**/go.sum'
      - name: Install verified scanner
        run: python3 .github/security/install.py gosec
      - name: Scan every pure Go module
        env:
          GOOS: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p build/security-reports
          scanner="$PWD/build/security-tools/gosec"
          reports="$PWD/build/security-reports"
          status=0
          for module in . carnical examples/http-server testing/coreruleset; do
            name=$(echo "$module" | tr '/.' '__')
            (cd "$module" && "$scanner" -exclude-dir=.attack -exclude-dir=build \
              -fmt=sarif -out="$reports/gosec-$GOOS-$name.sarif" ./...) || status=1
          done
          exit "$status"
      - name: Preserve findings even when the scan fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-${{ matrix.target }}
          path: build/security-reports/*.sarif
          if-no-files-found: error
          retention-days: 7

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: '**/go.sum'
      - name: Install verified scanner
        run: python3 .github/security/install.py osv-scanner
      - name: Enforce the scoped OpenPGP exception
        run: |
          mkdir -p build/security-reports
          for target in linux windows; do
            (cd testing/coreruleset && GOOS="$target" CGO_ENABLED=0 GOWORK=off \
              go list -mod=readonly -deps -test ./...) > "build/security-reports/imports-$target.txt"
            python3 .github/security/check_imports.py "build/security-reports/imports-$target.txt"
          done
      - name: Audit all five dependency manifests
        run: |
          mkdir -p build/security-reports
          build/security-tools/osv-scanner scan source --call-analysis=go --all-vulns \
            --lockfile=go.mod --lockfile=carnical/go.mod \
            --lockfile=examples/http-server/go.mod --lockfile=testing/coreruleset/go.mod \
            --lockfile=testing/modsecurity/go.mod \
            --format=json --output-file=build/security-reports/osv.json
      - name: Preserve dependency inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-dependencies
          path: build/security-reports/*
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: python3 .github/security/install.py gitleaks
      - name: Scan complete Git history with redacted output
        run: |
          mkdir -p build/security-reports
          build/security-tools/gitleaks git . --config=.gitleaks.toml --redact \
            --report-format=sarif --report-path=build/security-reports/gitleaks.sarif
      - name: Preserve redacted findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-secrets
          path: build/security-reports/gitleaks.sarif
          if-no-files-found: error
          retention-days: 7

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install verified checker
        run: python3 .github/security/install.py actionlint
      - name: Check workflow expressions and shell scripts
        run: build/security-tools/actionlint -pyflakes=
      - name: Verify installer security boundaries
        run: python3 .github/security/test_install.py

  regressions:
    name: Runtime regression and live WAF tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: '**/go.sum'
      - name: Test Coraza and every pure Go application module
        run: |
          for module in . carnical examples/http-server testing/coreruleset; do
            (cd "$module" && go test ./...)
          done
      - name: Exercise alternate rule evaluation modes
        run: |
          for tag in coraza.no_memoize coraza.rule.multiphase_evaluation coraza.rule.no_regex_multiline; do
            go test -tags="$tag" ./internal/seclang ./internal/corazawaf ./types
          done
      - name: Run varied attacks and benign traffic through the running WAF
        working-directory: carnical
        run: |
          mkdir -p ../build/security-reports
          go build -o ../build/carnical-ci ./cmd/carnical
          go run ./tools/loadtest -binary ../build/carnical-ci -corpus tools/loadtest/testdata \
            -count 10000 -variants -hardening -ddos off \
            -output ../build/security-reports/live-waf.json
          python3 ../.github/security/check_live_report.py ../build/security-reports/live-waf.json
      - name: Preserve the live test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-waf-regressions
          path: build/security-reports/*
          if-no-files-found: error
          retention-days: 7

  network-regressions:
    name: L3 and L4 live protection tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: '**/go.sum'
      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nftables iproute2
      - name: Check shield races and a live distributed flood
        working-directory: carnical
        shell: bash
        run: |
          mkdir -p ../build/security-reports
          go test -race ./shield -count=1 | tee ../build/security-reports/connection-races.log
          go test -race ./proxy -run TestAFloodFromAThousandAddressesThroughTheProxy -count=1 -v \
            | tee ../build/security-reports/live-flood.log
          CGO_ENABLED=0 go build -o ../build/carnical-network-linux ./cmd/carnical
      - name: Exercise kernel policy and live IPv4 and IPv6 WAF traffic
        shell: bash
        run: |
          sudo python3 .github/security/test_network_policy.py --binary build/carnical-network-linux \
            | tee build/security-reports/network-policy.log
      - name: Preserve network protection evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-protection-regressions
          path: build/security-reports/*.log
          if-no-files-found: warn
          retention-days: 7

  required:
    name: Security review required
    if: ${{ always() }}
    needs: [gosec, dependencies, secrets, workflows, regressions, network-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every category to succeed
        env:
          GOSEC: ${{ needs.gosec.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          SECRETS: ${{ needs.secrets.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          REGRESSIONS: ${{ needs.regressions.result }}
          NETWORK: ${{ needs.network-regressions.result }}
        run: |
          {
            echo '| Category | Result |'
            echo '| --- | --- |'
            echo "| Go code (Linux and Windows) | $GOSEC |"
            echo "| Dependencies | $DEPENDENCIES |"
            echo "| Secrets | $SECRETS |"
            echo "| Workflows | $WORKFLOWS |"
            echo "| Runtime and live WAF tests | $REGRESSIONS |"
            echo "| L3/L4 protection tests | $NETWORK |"
            echo ''
            echo 'Download the per-category artifacts from this run to inspect findings.'
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$GOSEC" "$DEPENDENCIES" "$SECRETS" "$WORKFLOWS" "$REGRESSIONS" "$NETWORK"; do
            if [ "$result" != success ]; then
              echo '::error::A security check failed, was cancelled, or was skipped.'
              exit 1
            fi
          done
